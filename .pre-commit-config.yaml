---
# =============================================================================
# pre-commit — the checks that run before a commit is allowed
# =============================================================================
#   make hooks     install (once per clone)
#   pre-commit run --all-files
#
# The point is not ceremony. Every hook here catches a class of mistake that is
# cheap to fix now and expensive later: an unformatted file that makes the next
# diff unreadable, a secret committed to history, YAML that only fails when
# Ansible parses it on a remote host.
#
# tflint and terraform-docs are Go binaries and must be on PATH — see the
# prerequisites in README.md. The Python and Go hooks below are installed by
# pre-commit into its own isolated environments; nothing to do.
# =============================================================================

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Preserve intentional trailing whitespace in Markdown line breaks.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        # Jinja templates are not valid YAML until rendered.
        exclude: (^|/)ansible/roles/.*/templates/
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  # ---------------------------------------------------------------------------
  # Terraform
  # ---------------------------------------------------------------------------
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.0
    hooks:
      - id: terraform_fmt

      - id: terraform_validate
        # Validate the root module only; it already walks into ./modules.
        # Validating a child module standalone fails on the provider config it
        # legitimately inherits from its caller.
        args: [--tf-init-args=-upgrade]
        exclude: (^|/)terraform/modules/

      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

      - id: terraform_docs
        # Keeps the variable/output tables in each module's README in sync with
        # the code, so documentation drift becomes a failing check.
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true

      - id: terraform_trivy
        # Static security scan. Skipped checks are declared, not silently
        # ignored: AVD-AWS ids do not apply to libvirt.
        args:
          - --args=--severity=HIGH,CRITICAL

  # ---------------------------------------------------------------------------
  # Ansible
  # ---------------------------------------------------------------------------
  - repo: https://github.com/ansible/ansible-lint
    rev: v25.9.2
    hooks:
      - id: ansible-lint
        name: ansible-lint
        files: (^|/)ansible/
        # Collections the roles import must be present for the syntax check.
        additional_dependencies:
          - ansible-core>=2.16

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint.yaml]
        exclude: (^|/)ansible/roles/.*/templates/

  # ---------------------------------------------------------------------------
  # Secrets
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      # No exclusions, deliberately. An earlier version of this file excluded the
      # encrypted vault, back when the policy was to commit it. Now that the vault
      # must never be committed, that exclusion would whitelist precisely the
      # mistake this hook exists to catch. .gitignore is the first line of defence;
      # this is the second, and a second line with a hole in it is not one.
      - id: gitleaks

  # ---------------------------------------------------------------------------
  # Shell
  # ---------------------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
