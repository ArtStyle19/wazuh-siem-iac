[defaults]
# A directory, not a file. Ansible merges every inventory source inside it, so the
# Terraform-generated `hosts` and a hand-written `vps` coexist without either
# owning the other — one is a build artifact, the other is your real machines.
#
# THE INVENTORY FILES HAVE NO EXTENSION, AND THAT IS LOAD-BEARING.
#
# inventory_ignore_extensions defaults to
#   ('.pyc', '.pyo', '.swp', '.bak', '~', '.rpm', '.md', '.txt', '.rst',
#    '.orig', '.ini', '.cfg', '.retry')
#
# `.ini` is in that list. So a directory inventory silently SKIPS hosts.ini, and
# you get "Unable to parse <dir> as an inventory source" followed by an empty host
# list — with nothing pointing at the extension as the cause. (It only bites for
# directory inventories; `-i hosts.ini` pointed straight at the file works fine,
# which makes it worse.)
#
# Extensionless is also the older Ansible convention, cf. /etc/ansible/hosts.
#
# Example files must not live in here either — a directory inventory tries to parse
# everything it contains. Templates live in ansible/examples/. (group_vars/ is
# exempt: Ansible treats it specially, and `.example` is outside
# YAML_FILENAME_EXTENSIONS, which is why group_vars/all/vault.yml.example is safe.)
inventory = inventory/
roles_path = roles

# collections_path is deliberately NOT set. Ansible's default already searches
# ~/.ansible/collections (where `make deps` installs), /usr/share/ansible/
# collections, and the collections bundled with ansible-core. Overriding it means
# enumerating those paths by hand, and omitting one — the bundled path is easy to
# forget — breaks module resolution in a way that reads as a typo in your
# playbook rather than a config error.

# Read as YAML rather than JSON. Costs nothing and makes a failed task's output
# legible, which matters when the failure is a 40-line container error.
stdout_callback = yaml
callbacks_enabled = ansible.posix.profile_tasks

interpreter_python = /usr/bin/python3
forks = 10
timeout = 30

# Lab-only. Every rebuild gives the VM a new host key on the same IP, so strict
# checking would fail on the second `make up`. On anything you do not rebuild
# daily, delete this line and manage known_hosts properly.
host_key_checking = False

# Show which tasks changed nothing, so `changed=0` on a second run is verifiable
# rather than a claim.
display_skipped_hosts = False
force_valid_group_names = ignore

nocows = 1
retry_files_enabled = False

[privilege_escalation]
become = False
become_method = sudo

[ssh_connection]
# Reuse one SSH connection for the whole run. On a play with ~60 tasks this is
# the difference between a 4-minute and a 12-minute run.
pipelining = True

# `-o PreferredAuthentications=publickey` USED TO BE HERE. Do not put it back.
#
# It made `make bootstrap` impossible while looking like a wrong password. Ansible
# already handles this itself, and conditionally: with no password it appends
#   -o PasswordAuthentication=no
#   -o PreferredAuthentications=gssapi-with-mic,gssapi-keyex,hostbased,publickey
# and with a password (`--ask-pass`) it deliberately appends neither, so the one
# connection that has no key yet can still authenticate.
#
# Pinning it here defeats that, because ssh_args goes FIRST on the ssh command line and
# ssh uses the FIRST value it obtains for an option — so the pin beats everything
# Ansible adds afterwards. `--ask-pass` then prompts, collects the password, and ssh
# never offers it. sshd answers `Permission denied (publickey,password)`, which names
# the methods the SERVER accepts and is byte-identical to a genuinely wrong password,
# so the config is the last place anyone looks.
#
# Same shape as the other gate-condition bugs here: a hardening option applied
# unconditionally, blocking the exact operation it was supposed to permit.
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=15
