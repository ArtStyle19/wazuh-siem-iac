---
# =============================================================================
# Indexer credentials
# =============================================================================
# The indexer stores passwords as bcrypt hashes in internal_users.yml. Upstream
# ships that file with hashes of the published demo passwords, which is fine for
# a five-minute trial and unacceptable for anything else.
#
# The hashes are produced by the indexer image's own hash.sh, run in a throwaway
# container. That avoids installing passlib on the control node and uses exactly
# the tool Wazuh's documentation prescribes, so the output is guaranteed to be a
# format the security plugin accepts.
#
# WHY THIS IS GUARDED BY A FILE-EXISTENCE CHECK
#
# bcrypt salts every hash, so hashing the same password twice yields different
# output. Re-hashing on every run would rewrite internal_users.yml every run and
# the play would never report changed=0. Worse, it would be misleading: after
# the indexer's first boot the file is no longer read, so rewriting it changes
# nothing about the live cluster. Rotation is a separate, explicit operation.
# =============================================================================

- name: Check whether credentials have already been configured
  ansible.builtin.stat:
    path: "{{ wazuh_config_dir }}/wazuh_indexer/internal_users.yml"
  register: wazuh_internal_users

- name: Configure indexer credentials
  when: not wazuh_internal_users.stat.exists or wazuh_force_password_rotation | bool
  block:
    - name: Pull the indexer image
      # hash.sh lives inside it, and the deployment needs it anyway. Pulling
      # explicitly turns a slow, silent step into a visible one.
      community.docker.docker_image_pull:
        name: "wazuh/wazuh-indexer:{{ wazuh_version }}"

    - name: Generate bcrypt hashes for the indexer users
      # --entrypoint bash bypasses the image's entrypoint, which is written for
      # starting OpenSearch and does work we neither need nor want here.
      # JAVA_HOME is set explicitly for the same reason.
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --entrypoint
          - bash
          - "wazuh/wazuh-indexer:{{ wazuh_version }}"
          - -c
          - >-
            JAVA_HOME=/usr/share/wazuh-indexer/jdk
            /usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh
            -p {{ item.password | quote }}
      loop:
        - { name: "{{ wazuh_indexer_username }}", password: "{{ wazuh_indexer_password }}" }
        - { name: "{{ wazuh_dashboard_username }}", password: "{{ wazuh_dashboard_password }}" }
      loop_control:
        label: "{{ item.name }}"
      register: wazuh_hash_results
      changed_when: false
      # The password is in argv. Without this it lands in the log verbatim.
      no_log: true

    - name: Extract the hashes from the tool output
      # hash.sh prints JVM notices alongside the hash, so pick the line that
      # actually looks like a bcrypt digest rather than assuming a position.
      ansible.builtin.set_fact:
        wazuh_user_hashes: >-
          {{ wazuh_user_hashes | default({}) | combine({
               item.item.name: item.stdout_lines
                 | select('match', '^\$2[aby]\$') | list | last
             }) }}
      loop: "{{ wazuh_hash_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      no_log: true

    - name: Fail if a hash could not be produced
      ansible.builtin.assert:
        that:
          - wazuh_user_hashes | length == 2
          - wazuh_user_hashes[wazuh_indexer_username] is match('^\$2[aby]\$')
          - wazuh_user_hashes[wazuh_dashboard_username] is match('^\$2[aby]\$')
        fail_msg: >-
          hash.sh did not return a usable bcrypt hash. Run it by hand to see the
          real output:
          docker run --rm --entrypoint bash wazuh/wazuh-indexer:{{ wazuh_version }}
          -c '/usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh -p test'

    - name: Write internal_users.yml
      ansible.builtin.template:
        src: internal_users.yml.j2
        dest: "{{ wazuh_config_dir }}/wazuh_indexer/internal_users.yml"
        # Bind-mounted into the indexer, so it must be owned by the indexer's uid.
        # See the ownership note in defaults/main.yml.
        owner: "{{ wazuh_indexer_uid }}"
        group: "{{ wazuh_indexer_gid }}"
        mode: "0640"
      no_log: true
