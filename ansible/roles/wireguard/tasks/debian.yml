---
- name: Install WireGuard tooling
  # wireguard-tools only. The `wireguard` metapackage additionally pulls
  # wireguard-dkms, which builds a kernel module that has been unnecessary since
  # Linux 5.6 shipped WireGuard in-tree — on Debian 12 (6.1) and 13 it is pure cost
  # and a compile step that can fail on a headless box.
  ansible.builtin.apt:
    name: wireguard-tools
    state: present
    update_cache: true
    cache_valid_time: 3600
